<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <clipPath id="scr"><rect x="14" y="14" width="332" height="712" rx="42"/></clipPath>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="totalgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient>
    <linearGradient id="fab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
  </defs>

  <!-- phone frame -->
  <rect x="6" y="6" width="348" height="728" rx="48" fill="#05070d" stroke="#1b1e2a" stroke-width="1.5"/>
  <g clip-path="url(#scr)">
    <rect x="14" y="14" width="332" height="712" fill="#0a0a0f"/>
    <rect x="14" y="14" width="332" height="360" fill="url(#glow)"/>

    <!-- status bar -->
    <text x="34" y="46" fill="#fff" font-size="13" font-weight="600">9:41</text>
    <text x="326" y="46" fill="#fff" font-size="12" text-anchor="end">5G ▮▮▮</text>

    <!-- eyebrow + total -->
    <text x="34" y="86" fill="#8b8ba3" font-size="10.5" letter-spacing="1.6" font-weight="600">TOTAL BALANCE · 3 BANKS</text>
    <text x="33" y="132" fill="url(#totalgrad)" font-size="44" font-weight="700" letter-spacing="-1">€19.915</text>

    <!-- stacked wallet cards -->
    <g>
      <rect x="34" y="152" width="292" height="96" rx="20" fill="url(#c3)" opacity="0.9" transform="translate(0,54)"/>
      <rect x="34" y="152" width="292" height="96" rx="20" fill="url(#c2)" opacity="0.95" transform="translate(0,27)"/>
      <rect x="34" y="152" width="292" height="96" rx="20" fill="url(#c1)"/>
      <text x="52" y="180" fill="#fff" font-size="13" font-weight="600">Aurora Bank</text>
      <text x="52" y="196" fill="#e5edff" font-size="10" opacity="0.8">Checking ·· 4021</text>
      <rect x="256" y="166" width="54" height="20" rx="10" fill="#ffffff" opacity="0.18"/>
      <text x="283" y="180" fill="#fff" font-size="8.5" text-anchor="middle" letter-spacing="0.5">CHECKING</text>
      <text x="52" y="230" fill="#fff" font-size="21" font-weight="700">€2.340,18</text>
    </g>

    <!-- investments panel -->
    <rect x="34" y="470" width="292" height="150" rx="20" fill="#13131d" stroke="#232333"/>
    <text x="52" y="498" fill="#b8b8cc" font-size="11" font-weight="600">Investments</text>
    <rect x="250" y="486" width="60" height="20" rx="10" fill="#34d399" opacity="0.16"/>
    <text x="280" y="500" fill="#34d399" font-size="11" text-anchor="middle" font-weight="600">▲ +12,4%</text>
    <text x="52" y="524" fill="#fff" font-size="22" font-weight="700">€8.640,00</text>
    <path d="M52,588 C88,580 108,582 140,566 C176,548 206,556 236,552 C266,548 292,536 308,540 L308,600 L52,600 Z" fill="url(#area)"/>
    <path d="M52,588 C88,580 108,582 140,566 C176,548 206,556 236,552 C266,548 292,536 308,540" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <g font-size="10" font-weight="600" text-anchor="middle">
      <rect x="52" y="602" width="80" height="10" rx="0" fill="none"/>
    </g>

    <!-- floating nav (pill, no action button) -->
    <rect x="70" y="656" width="220" height="58" rx="28" fill="#13131d" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="80" y="664" width="74" height="42" rx="20" fill="#6366f1"/>
    <!-- Home (active) -->
    <g transform="translate(108.4,668) scale(0.72)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
    </g>
    <text x="117" y="703" fill="#fff" font-size="8" text-anchor="middle" font-weight="600">Home</text>
    <!-- Invest (chart) -->
    <g transform="translate(191.4,676) scale(0.72)" fill="none" stroke="#8b8ba3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/>
    </g>
    <!-- Settings (gear) -->
    <g transform="translate(246.4,676) scale(0.72)" fill="none" stroke="#8b8ba3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.6 15H4a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 11 4.6V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
    </g>
  </g>
  <rect x="146" y="16" width="68" height="20" rx="10" fill="#05070d"/>
</svg>
