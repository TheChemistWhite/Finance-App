    <text x="180" y="295" fill="#818cf8" font-size="34" text-anchor="middle" font-weight="700">b</text>
    <text x="180" y="336" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">Vibrant</text>
    <text x="180" y="360" fill="#818cf8" font-size="22" text-anchor="middle" font-weight="700">Wallet</text>

