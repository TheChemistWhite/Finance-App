    <radialGradient id="glow3" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
