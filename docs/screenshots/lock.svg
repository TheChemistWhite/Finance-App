    <text x="180" y="558" fill="#8b8ba3" font-size="12.5" text-anchor="middle">o l'impronta per proteggere i tuoi dati.</text>

    <rect x="46" y="586" width="268" height="52" rx="16" fill="url(#btn)"/>
